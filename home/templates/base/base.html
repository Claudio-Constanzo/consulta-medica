{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Consulta Médica{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'formulario/css/registro-style.css' %}">
</head>
<body>

<header class="header">
    <div class="container">
        <a href="/" class="logo">Consulta Médica</a>
        <nav class="nav">
            <a href="{% url 'home' %}">Inicio</a>
            <a href="{% url 'agendar-cita' %}">Agendar Cita</a>
            <a href="{% url 'registro' %}">Registro</a>
            {% if request.user.is_authenticated %}
                <a href="{% url 'logout' %}">Cerrar sesión</a>
            {% else %}
                <a href="{% url 'login' %}">Iniciar sesión</a>
            {% endif %}
        </nav>
    </div>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <p>&copy; 2025 Consulta Médica</p>
</footer>

</body>
</html>
